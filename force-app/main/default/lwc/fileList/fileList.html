<template>
  <template if:true={isLoading}>
    <lightning-spinner
      alternative-text="Loading"
      size="small"
      variant="brand"
    ></lightning-spinner>
  </template>
  <lightning-card icon-name="standard:file" variant="base">
    <div slot="title">{cardTitle}</div>
    <div slot="actions"></div>
    <div slot="footer"><a onclick={viewAllRecords}>View All</a></div>
    <div>
      <ul class="slds-grid slds-gutters slds-wrap">
        <template for:each={dataTableFiles} for:item="file">
          <c-file-card key={file.Id} file={file}></c-file-card>
        </template>
      </ul>
    </div>
  </lightning-card>
</template>
