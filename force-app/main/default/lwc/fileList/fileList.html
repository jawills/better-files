<template>
  <template if:true={isLoading}>
    <!-- <lightning-spinner
      alternative-text="Loading"
      size="small"
      variant="brand"
    ></lightning-spinner> -->
  </template>
  <lightning-card icon-name="standard:file" variant="base">
    <div slot="title">
      <a class="slds-card__header-link" onclick={viewAllRecords}>{cardTitle}</a>
    </div>
    <div slot="actions">
      <lightning-file-upload
        accept={accept}
        record-id={recordId}
        onuploadfinished={handleUploadFinished}
        multiple={multiple}
      >
      </lightning-file-upload>
    </div>
    <div slot="footer" if:false={showDropZone}>
      <a onclick={viewAllRecords}>View All</a>
    </div>
    <div if:true={showDropZone}>
      <lightning-file-upload
        accept={accept}
        record-id={recordId}
        onuploadfinished={handleUploadFinished}
        class="file-selector-image"
        multiple={multiple}
      >
      </lightning-file-upload>
    </div>
    <div if:false={showDropZone}>
      <ul class="slds-grid slds-gutters slds-wrap">
        <template for:each={dataTableFiles} for:item="file">
          <c-file-card
            class="uiAbstractList"
            key={file.Id}
            file={file}
          ></c-file-card>
        </template>
      </ul>
    </div>
  </lightning-card>
</template>
