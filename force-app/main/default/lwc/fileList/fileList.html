<template>
  <lightning-card icon-name="standard:file" variant="base">
    <template if:true={isLoading}>
      <lightning-spinner
        alternative-text="Loading"
        size="small"
        variant="brand"
      ></lightning-spinner>
    </template>
    <div slot="title" class="slds-page-header">
      Files <template if:true={showFileCount}> ({fileCount})</template>
    </div>
    <div slot="actions">
      <lightning-file-upload
        if:true={showFileUpload}
        name="fileUploader"
        record-id={recordId}
        onuploadfinished={handleUploadFinished}
        multiple="true"
      >
      </lightning-file-upload>
    </div>
    <div slot="footer"></div>
    <div>
      <!-- <ul>
        <template for:each={dataTableFiles} for:item="file">
          <c-file-card key={file.Id} file={file}></c-file-card>
        </template>
      </ul> -->
      <c-file-data-table key-field="id" data={dataTableFiles} columns={columns}>
      </c-file-data-table>
    </div>
  </lightning-card>
</template>
