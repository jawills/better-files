<template>
  <template if:true={isLoading}>
    <lightning-spinner
      alternative-text="Loading"
      size="small"
      variant="brand"
    ></lightning-spinner>
  </template>
  <div class="slds-page-header slds-page-header_record-home page-header">
    <div class="slds-page-header__row">
      <div class="slds-page-header__col-title">
        <div class="slds-media">
          <div class="slds-media__figure">
            <span class="slds-icon_container">
              <lightning-icon
                icon-name="standard:file"
                alternative-text={cardTitle}
                title={cardTitle}
                size="small"
              ></lightning-icon>
            </span>
          </div>
          <div class="slds-media__body">
            <lightning-breadcrumbs>
              <lightning-breadcrumb label={baseObjectName} href={baseObjectUrl}>
              </lightning-breadcrumb>
              <lightning-breadcrumb
                label={relatedRecordName}
                href={relatedRecordUrl}
                onclick={viewRelatedRecord}
              >
              </lightning-breadcrumb>
            </lightning-breadcrumbs>
            <h2 class="slds-card__header-title">{cardTitle}</h2>
          </div>
        </div>
      </div>

      <div class="slds-page-header__col-actions">
        <div class="slds-page-header__controls">
          <div
            class="slds-page-header__control slds-grid slds-gutters slds-grid_vertical-align-center slds-media slds-media_center"
          >
            <div class="slds-col slds-text-body_small">{selectedText}</div>
            <lightning-input
              class="slds-col"
              style="margin-top: auto; margin-bottom: auto"
              type="search"
              placeholder="Search files..."
              onchange={handleSearchKeyChange}
              value={searchTerm}
            >
            </lightning-input>
            <lightning-button-group
              lwc:if={hasSelectedRecords}
              class="slds-col slds-var-p-top_medium"
              style="margin-top: auto; margin-bottom: auto"
            >
              <lightning-button
                label="Download"
                onclick={downloadSelectedRecords}
              ></lightning-button>
              <lightning-button
                label="Delete"
                variant="destructive"
                onclick={deleteSelectedRecords}
              ></lightning-button>
            </lightning-button-group>
            <lightning-file-upload
              if:true={showFileUpload}
              name="fileUploader"
              record-id={baseRecordId}
              onuploadfinished={handleUploadFinished}
              class="slds-col"
              multiple="true"
            >
            </lightning-file-upload>
          </div>
        </div>
      </div>
    </div>

    <div class="slds-page-header__row slds-page-header__row_gutters">
      <div class="slds-page-header__col-details">
        <ul
          class="slds-page-header__detail-row slds-p-around_none page-header-detail"
        >
          <c-file-data-table
            key-field="id"
            data={dataTableFiles}
            columns={columns}
            min-col-width="25"
            onrowaction={handleRowAction}
            onrowselection={getSelectedRecords}
          >
          </c-file-data-table>
        </ul>
      </div>
    </div>
  </div>
  <div class="slds-grid slds-grid_align-center" if:true={hasAdditionalFiles}>
    <lightning-button
      label="Get More Records"
      class="slds-var-p-vertical_x-small"
      onclick={getAdditionalFiles}
    ></lightning-button>
  </div>
</template>
