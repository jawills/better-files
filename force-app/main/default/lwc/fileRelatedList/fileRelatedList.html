<template>
  <template if:true={isLoading}>
    <lightning-spinner
      alternative-text="Loading"
      size="small"
      variant="brand"
    ></lightning-spinner>
  </template>
  <div class="slds-page-header slds-page-header_record-home page-header">
    <div class="slds-page-header__row">
      <div class="slds-page-header__col-title">
        <div class="slds-media">
          <div class="slds-media__figure">
            <span class="slds-icon_container">
              <lightning-icon
                icon-name="standard:file"
                alternative-text={cardTitle}
                title={cardTitle}
                size="small"
              ></lightning-icon>
            </span>
          </div>
          <div class="slds-media__body">
            <lightning-breadcrumbs>
              <lightning-breadcrumb label={baseObjectName} href={baseObjectUrl}>
              </lightning-breadcrumb>
              <lightning-breadcrumb
                label={relatedRecordName}
                href={relatedRecordUrl}
                onclick={viewRelatedRecord}
              >
              </lightning-breadcrumb>
            </lightning-breadcrumbs>
            <h2 class="slds-card__header-title">{cardTitle}</h2>
          </div>
        </div>
      </div>

      <div class="slds-page-header__col-actions">
        <div class="toolbar">
          <div class="toolbar__selection slds-text-body_small">
            {selectedText}
          </div>
          <lightning-combobox
            class="toolbar__filter"
            label="File type"
            variant="label-hidden"
            value={fileTypeFilter}
            options={fileTypeOptions}
            onchange={handleFileTypeChange}
          >
          </lightning-combobox>
          <lightning-input
            class="toolbar__search"
            type="search"
            label="Search files"
            variant="label-hidden"
            placeholder="Search files..."
            onchange={handleSearchKeyChange}
            value={searchTerm}
          >
          </lightning-input>
          <lightning-button-group
            lwc:if={hasSelectedRecords}
            class="toolbar__button-group"
          >
            <lightning-button
              label="Download"
              onclick={downloadSelectedRecords}
            ></lightning-button>
            <lightning-button
              label="Delete"
              variant="destructive"
              onclick={deleteSelectedRecords}
            ></lightning-button>
          </lightning-button-group>
          <div class="toolbar__upload-wrap">
            <lightning-file-upload
              if:true={showFileUpload}
              class="toolbar__upload"
              name="fileUploader"
              record-id={baseRecordId}
              onuploadfinished={handleUploadFinished}
              multiple="true"
            >
            </lightning-file-upload>
          </div>
        </div>
      </div>
    </div>

    <div class="slds-page-header__row slds-page-header__row_gutters">
      <div class="slds-page-header__col-details">
        <ul
          class="slds-page-header__detail-row slds-p-around_none page-header-detail"
        >
          <template for:each={tableMountKey} for:item="mount">
            <c-file-data-table
              key={mount.id}
              key-field="Id"
              data={dataTableFiles}
              columns={columns}
              min-col-width="25"
              resize-column-disabled
              onrowaction={handleRowAction}
              onrowselection={getSelectedRecords}
            >
            </c-file-data-table>
          </template>
          <div
            if:true={loadErrorMessage}
            class="slds-text-color_error slds-p-around_small"
            data-id="load-error"
          >
            {loadErrorMessage}
          </div>
          <div
            if:true={showEmptyTableMessage}
            class="slds-text-align_center slds-p-around_medium"
            data-id="empty-table"
          >
            No files to display.
          </div>
        </ul>
      </div>
    </div>
  </div>
  <div class="slds-grid slds-grid_align-center" if:true={hasAdditionalFiles}>
    <lightning-button
      data-id="get-more"
      label="Get More Records"
      class="slds-var-p-vertical_x-small"
      onclick={getAdditionalFiles}
    ></lightning-button>
  </div>
</template>
