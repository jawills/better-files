<template>
  <li
    class="slds-col slds-size_12-of-12 slds-var-p-horizontal_medium slds-var-p-vertical_xx-small"
  >
    <a href={file.fileUrl} onclick={handleClick}>
      <div class="slds-size_12-of-12 slds-grid slds-grid_align-end">
        <template if:true={file.hasPreview}>
          <div
            class="slds-show_inline-block slds-size_1-of-12 slds-float_left thumbnailImg medium"
          >
            <img src={file.imageUrl} /></div
        ></template>
        <template if:false={file.hasPreview}>
          <div
            class="slds-show_inline-block slds-size_1-of-12 slds-float_left slds-truncate_container_50 medium"
          >
            <lightning-icon
              class="slds-icon_container"
              icon-name={file.icon}
            ></lightning-icon></div
        ></template>
        <div
          class="slds-show_inline-block slds-float_left slds-size_11-of-12 slds-var-p-left_x-small slds-truncate slds-var-m-right_x-small"
        >
          <span title={file.Title} class="slds-truncate">{file.Title}</span>
          <p
            class="secondaryFields slds-m-around_none secondaryFields slds-text-body_small slds-truncate"
          >
            <lightning-formatted-date-time value={file.LastModifiedDate}>
            </lightning-formatted-date-time
            ><span>{file.ContentSize}</span><span>{file.FileExtension}</span>
          </p>
        </div>
      </div>
    </a>
  </li>
</template>
