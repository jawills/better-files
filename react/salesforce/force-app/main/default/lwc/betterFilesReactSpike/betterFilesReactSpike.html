<template>
  <div class="test-page slds-p-around_medium">
    <h1 class="slds-text-heading_medium">
      Better Files: React embedding check
    </h1>
    <p class="slds-m-vertical_small">{description}</p>
    <div class="controls slds-m-bottom_medium">
      <lightning-combobox
        lwc:if={isFixture}
        label="Fixture state"
        value={scenario}
        options={scenarios}
        onchange={handleScenario}
      ></lightning-combobox>
      <lightning-button
        label={toggleLabel}
        onclick={toggleMount}
        disabled={isLoading}
      ></lightning-button>
    </div>
    <template lwc:if={errorMessage}
      ><p role="alert">{errorMessage}</p></template
    >
    <h2 class="slds-text-title slds-m-bottom_small">Main record region</h2>
    <div class="wide" data-card="main" lwc:dom="manual"></div>
    <h2 class="slds-text-title slds-m-vertical_small">Narrow record region</h2>
    <div class="narrow" data-card="narrow" lwc:dom="manual"></div>
  </div>
</template>
