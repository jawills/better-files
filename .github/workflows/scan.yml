name: Salesforce Code Analyzer Workflow
on: push
jobs:
  salesforce-code-analyzer-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            react/package-lock.json
      - name: Ensure java v11 or greater
        uses: actions/setup-java@v4
        with:
          java-version: ">=11"
          distribution: "zulu"
      - name: Ensure python v3.10 or greater
        uses: actions/setup-python@v5
        with:
          python-version: ">=3.10"

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Install Latest Salesforce Code Analyzer CLI Plugin
        run: sf plugins install code-analyzer@latest

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix react

      - name: Build and scan source and UIBundle
        run: npm run scan

      - name: Upload analyzer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-code-analyzer-results
          path: analyzer/
